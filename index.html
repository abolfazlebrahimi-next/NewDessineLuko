<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>شهر لوکو 🌳</title>
  <script>
    // ارتفاع واقعیِ قابل‌دید روی موبایل؛ نوار آدرس مرورگر پایین صفحه را قطع نکند
    (function () {
      var root = document.documentElement;
      function setH() {
        var h = window.visualViewport ? visualViewport.height : window.innerHeight;
        root.style.setProperty('--app-h', h + 'px');
      }
      setH();
      window.addEventListener('resize', setH);
      window.addEventListener('orientationchange', setH);
      if (window.visualViewport) visualViewport.addEventListener('resize', setH);
    })();
  </script>
  <script>
    // اگر خطایی موقع بارگذاری رخ داد، متنش روی صفحه‌ی لودینگ دیده شود (نه صفحه‌ی سفید)
    window.__bootError = null;
    window.addEventListener('error', function (e) {
      if (window.__LUKO_BOOTED__ || window.__bootError) return;
      window.__bootError = (e && e.message) || 'خطا در بارگذاری فایل‌ها';
      var show = function () {
        var l = document.getElementById('loading');
        if (!l) return;
        l.classList.remove('done');
        var t = l.querySelector('.loading-inner div');
        if (t) t.textContent = 'خطایی رخ داد: ' + window.__bootError;
      };
      if (document.body) show();
      else document.addEventListener('DOMContentLoaded', show);
    }, true);
  </script>
  <link rel="preload" href="fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="assets/coin.png">
</head>
<body>
  <div id="game">
    <canvas id="scene"></canvas>
    <div id="overlay">
      <div id="labels"></div>
      <div id="toasts"></div>
      <div id="drag-ghost"></div>
    </div>
  </div>
  <div id="loading">
    <div class="loading-inner">
      <img src="assets/coin.png" alt="" class="loading-coin">
      <div>در حال ساخت شهر لوکو…</div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
    // حذف صفحه‌ی لودینگ فقط وقتی بازی واقعاً بالا آمد؛
    // اگر طول کشید، به‌جای صفحه‌ی سفید راهنما نشان داده می‌شود
    (function () {
      var t0 = Date.now();
      var iv = setInterval(function () {
        var l = document.getElementById('loading');
        if (!l) { clearInterval(iv); return; }
        if (window.__LUKO_BOOTED__) {
          clearInterval(iv);
          l.classList.add('done');
          setTimeout(function () { l.remove(); }, 500);
        } else if (!window.__bootError && Date.now() - t0 > 20000) {
          clearInterval(iv);
          var t = l.querySelector('.loading-inner div');
          if (t) t.textContent = 'شبکه کند است، مدل‌ها یکی‌یکی می‌آیند… چند لحظه صبر کن.';
        }
      }, 250);
    })();
  </script>
</body>
</html>
